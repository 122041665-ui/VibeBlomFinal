services:
  api:
    build: ./VibeBloomAPI
    env_file:
      - ./VibeBloom/.env
    container_name: vibebloom_api
    restart: always
    ports:
      - "8010:8010"
    environment:
      APP_NAME: VibeBloom API
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8010

      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: Resendiz100
      MYSQL_DB: vibebloom

      SECRET_KEY: your-secret-key-here-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ALGORITHM: HS256
      API_PUBLIC_URL: http://127.0.0.1:8010
    volumes:
      - ./VibeBloomAPI/storage:/app/storage

  admin:
    build:
      context: .
      dockerfile: VibeBloomAdmin/Dockerfile
    container_name: vibebloom_admin
    restart: always
    depends_on:
      - api
    ports:
      - "5010:5010"
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      SECRET_KEY: your-secret-key-here-change-in-production
      HOST: 0.0.0.0
      PORT: 5010

      FASTAPI_URL: http://api:8010
      API_URL: http://api:8010
      API_PUBLIC_URL: http://127.0.0.1:8010

  laravel:
    build: ./VibeBloom
    container_name: vibebloom_laravel
    restart: always
    depends_on:
      - api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: VibeBloom
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      FASTAPI_URL: http://api:8010
      API_URL: http://api:8010
      API_PUBLIC_URL: http://127.0.0.1:8010
      VITE_API_URL: http://127.0.0.1:8010
    volumes:
      # Laravel conserva autenticación local; los datos de negocio viven en la API/MySQL.
      - ./VibeBloom/database/database.sqlite:/app/database/database.sqlite
      - ./VibeBloom/storage/app/public:/app/storage/app/public
