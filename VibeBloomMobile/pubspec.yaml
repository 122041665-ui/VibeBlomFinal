name: vibebloom_mobile
description: Aplicación móvil de VibeBloom enfocada en descubrir lugares cercanos.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  config:
    # Este proyecto iOS ya integra los plugins mediante CocoaPods. Evita que
    # Flutter 3.44+ agregue además el paquete Swift generado y bloquee Xcode.
    enable-swift-package-manager: false
  uses-material-design: true
