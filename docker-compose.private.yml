name: vibebloom-private

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 300m
    command:
      - --bind-address=0.0.0.0
      - --mysqlx=0
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=96M
      - --key-buffer-size=8M
      - --max-connections=30
      - --table-open-cache=200
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME:?Define MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
    ports:
      - "${PRIVATE_VPC_IP:?Define PRIVATE_VPC_IP}:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    mem_limit: 80m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Define REDIS_PASSWORD}
    ports:
      - "${PRIVATE_VPC_IP:?Define PRIVATE_VPC_IP}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD}

volumes:
  mysql_data:
  redis_data:
