name: vibebloom-production

services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Define WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Define ADMIN_DOMAIN}
      NGINX_ENVSUBST_FILTER: WEB_DOMAIN|API_DOMAIN|ADMIN_DOMAIN
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      laravel:
        condition: service_healthy
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - public
      - private

  api:
    build:
      context: ./VibeBloomAPI
      dockerfile: Dockerfile.production
    restart: unless-stopped
    expose:
      - "8010"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      MYSQL_HOST: ${MYSQL_HOST:?Define MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DATABASE:?Define MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME:?Define MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      SECRET_KEY: ${JWT_SECRET:?Define JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALGORITHM: HS256
      API_PUBLIC_URL: https://${API_DOMAIN:?Define API_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Define OPENAI_API_KEY}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:?Define MAPBOX_TOKEN}
    volumes:
      - api_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - private

  admin:
    build:
      context: .
      dockerfile: VibeBloomAdmin/Dockerfile.production
    restart: unless-stopped
    expose:
      - "5010"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      SECRET_KEY: ${FLASK_SECRET:?Define FLASK_SECRET}
      FASTAPI_URL: http://api:8010
      API_URL: http://api:8010
      API_PUBLIC_URL: https://${API_DOMAIN:?Define API_DOMAIN}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:?Define MAPBOX_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    networks:
      - private

  laravel:
    build:
      context: ./VibeBloom
      dockerfile: Dockerfile.production
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: VibeBloom
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY}
      APP_URL: https://${WEB_DOMAIN:?Define WEB_DOMAIN}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: ${MYSQL_HOST:?Define MYSQL_HOST}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USERNAME:?Define MYSQL_USERNAME}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FASTAPI_URL: http://api:8010
      API_URL: http://api:8010
      API_PUBLIC_URL: https://${API_DOMAIN:?Define API_DOMAIN}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:?Define MAPBOX_TOKEN}
    command: >-
      sh -c "php artisan config:cache && php artisan route:cache && php artisan view:cache && apache2-foreground"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - private

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

networks:
  public:
  private:
    # No publica puertos de los servicios. Conserva salida a MySQL/OpenAI/Mapbox.

volumes:
  api_storage:
  redis_data:
